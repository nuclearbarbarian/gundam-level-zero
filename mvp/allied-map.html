<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GLZ — Allied Industrial Integration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&family=Playfair+Display:wght@700&family=Source+Serif+4:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

<style>

:root {
  --color-ink: #1A1A1A;
  /* MechaPDS v0.2 typography lock — ARPANET register (Plex Mono only) */
  --font-serif: 'IBM Plex Mono', Consolas, monospace !important;
  --font-display: 'IBM Plex Mono', Consolas, monospace !important;
  --font-mono: 'IBM Plex Mono', Consolas, monospace !important;

  --color-newsprint: #F5F2E8;
  --color-paper: #FDFCF9;
  --color-warm-gray: #9C9788;
  --color-blue: #2B4B6F;
  --color-red: #8B2B2B;
  --font-serif: 'Source Serif 4', 'Charter', 'Georgia', serif;
  --font-display: 'Playfair Display', 'Charter', 'Georgia', serif;
  --font-mono: 'IBM Plex Mono', 'Consolas', monospace;
  --sidebar-width: 280px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--color-newsprint);
  color: var(--color-ink);
  font-family: var(--font-serif);
  overflow: hidden;
}

.explorer {
  display: flex;
  width: 100vw;
  height: 100vh;
}

/* ── Sidebar ─────────────────────────────────────────────── */
.sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  background: var(--color-newsprint);
  border-right: 2px solid var(--color-ink);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  transition: margin-left 0.2s ease;
  z-index: 10;
}

.sidebar.collapsed {
  margin-left: calc(-1 * var(--sidebar-width));
}

.sidebar-header {
  padding: 20px 16px 12px;
  border-bottom: 2px solid var(--color-ink);
}

.explorer-title {
  font-family: var(--font-display);
  font-size: 18pt;
  line-height: 1.2;
  margin-bottom: 4px;
}

.explorer-subtitle {
  font-style: italic;
  font-size: 10pt;
  color: var(--color-warm-gray);
}

.sidebar-section {
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--color-warm-gray);
}

.section-header {
  font-family: var(--font-mono);
  font-size: 9pt;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  margin-bottom: 10px;
  color: var(--color-ink);
}

/* ── Layer toggles ───────────────────────────────────────── */
.layer-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  font-size: 10pt;
}

.layer-toggle input[type="checkbox"] {
  appearance: none;
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  border: 1.5px solid var(--color-ink);
  background: var(--color-paper);
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
}

.layer-toggle input[type="checkbox"]:checked {
  background: var(--color-ink);
}

.layer-toggle input[type="checkbox"]:checked::after {
  content: '\2713';
  color: var(--color-paper);
  font-size: 10px;
  position: absolute;
  top: -1px;
  left: 1px;
}

/* ── Filters ─────────────────────────────────────────────── */
.filter-group {
  margin-bottom: 10px;
}

.filter-label {
  font-family: var(--font-mono);
  font-size: 8pt;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 4px;
  color: var(--color-warm-gray);
}

.filter-select {
  width: 100%;
  padding: 4px 8px;
  border: 1px solid var(--color-ink);
  background: var(--color-paper);
  font-family: var(--font-serif);
  font-size: 10pt;
  color: var(--color-ink);
  cursor: pointer;
}

/* ── Legend ───────────────────────────────────────────────── */
.legend-group {
  margin-bottom: 12px;
}

.legend-title {
  font-family: var(--font-mono);
  font-size: 8pt;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-bottom: 6px;
  color: var(--color-warm-gray);
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
  font-size: 9pt;
}

.legend-swatch {
  width: 14px;
  height: 14px;
  border: 0.5px solid var(--color-ink);
  flex-shrink: 0;
}

.legend-swatch.circle {
  border-radius: 50%;
}

.legend-swatch.line-swatch {
  width: 20px;
  height: 3px;
  border: none;
}

.legend-ramp {
  display: flex;
  margin-bottom: 4px;
}

.legend-ramp-cell {
  height: 14px;
  flex: 1;
  border: 0.5px solid var(--color-ink);
  border-right: none;
}

.legend-ramp-cell:last-child {
  border-right: 0.5px solid var(--color-ink);
}

.legend-ramp-labels {
  display: flex;
  justify-content: space-between;
  font-family: var(--font-mono);
  font-size: 7pt;
  color: var(--color-warm-gray);
}

/* ── Map area ────────────────────────────────────────────── */
.map-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  position: relative;
}

.map-container {
  flex: 1;
}

.sidebar-toggle {
  position: absolute;
  top: 10px;
  left: 10px;
  z-index: 5;
  width: 28px;
  height: 28px;
  background: var(--color-paper);
  border: 1.5px solid var(--color-ink);
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--color-ink);
  line-height: 1;
}

.sidebar-toggle:hover {
  background: var(--color-newsprint);
}

/* ── Source bar ───────────────────────────────────────────── */
.source-bar {
  padding: 6px 16px;
  border-top: 1px solid var(--color-ink);
  background: var(--color-newsprint);
  display: flex;
  justify-content: space-between;
  font-style: italic;
  font-size: 9pt;
  color: var(--color-warm-gray);
}

/* ── MapLibre popup override ─────────────────────────────── */
.maplibregl-popup-content {
  background: var(--color-paper) !important;
  border: 1.5px solid var(--color-ink) !important;
  border-radius: 0 !important;
  padding: 0 !important;
  font-family: var(--font-serif) !important;
  box-shadow: 2px 2px 0 rgba(0,0,0,0.1) !important;
  max-width: 300px !important;
}

.maplibregl-popup-close-button {
  font-size: 16px !important;
  color: var(--color-ink) !important;
  padding: 2px 6px !important;
}

.maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
  border-top-color: var(--color-ink) !important;
}

.maplibregl-popup-anchor-top .maplibregl-popup-tip {
  border-bottom-color: var(--color-ink) !important;
}

.maplibregl-popup-anchor-left .maplibregl-popup-tip {
  border-right-color: var(--color-ink) !important;
}

.maplibregl-popup-anchor-right .maplibregl-popup-tip {
  border-left-color: var(--color-ink) !important;
}

.popup-header {
  padding: 8px 12px;
  font-family: var(--font-mono);
  font-size: 9pt;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--color-ink);
  background: var(--color-newsprint);
}

.popup-body {
  padding: 8px 12px;
}

.popup-row {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  padding: 2px 0;
  font-size: 9pt;
  border-bottom: 0.5px solid #e8e6e2;
}

.popup-row:last-child {
  border-bottom: none;
}

.popup-field {
  color: var(--color-warm-gray);
  font-family: var(--font-mono);
  font-size: 8pt;
  text-transform: uppercase;
}

.popup-value {
  font-family: var(--font-mono);
  font-size: 9pt;
  text-align: right;
}

/* ── Error display ───────────────────────────────────────── */
.error-message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: var(--color-paper);
  border: 2px solid var(--color-red);
  padding: 24px;
  max-width: 500px;
  font-family: var(--font-mono);
  font-size: 10pt;
  color: var(--color-red);
  z-index: 100;
}
</style>
</head>

// ================================================================
// Color ramps (Penney Design System)
// ================================================================
var COLOR_RAMPS = {
  blue:   ['#dce4ed','#b8c9db','#7a9ab8','#4d7294','#2B4B6F'],
  red:    ['#f0d8d8','#dba8a8','#c07070','#a24848','#8B2B2B'],
  green:  ['#d8e8d8','#aecbae','#7aa87a','#568256','#3D5C3D'],
  gray:   ['#e8e6e2','#ccc9c2','#aaa69d','#88847b','#5C5C5C'],
  yellow: ['#f5ecd0','#e8d9a0','#d4c070','#C4A035','#9a7d28']
};

// ================================================================
// Utility functions
// ================================================================
function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function formatValue(val, fmt) {
  if (val == null) return '\u2014';
  switch (fmt) {
    case 'percent': return (val * 100).toFixed(1) + '%';
    case 'currency': return '$' + Number(val).toLocaleString();
    case 'decimal': return Number(val).toFixed(2);
    case 'integer': default: return Math.round(Number(val)).toLocaleString();
  }
}

function hexToRgb(hex) {
  return [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
}

function rgbToHex(r, g, b) {
  return '#' + [r,g,b].map(function(c){ return Math.round(c).toString(16).padStart(2,'0'); }).join('');
}

function interpolateColor(c1, c2, t) {
  var a = hexToRgb(c1), b = hexToRgb(c2);
  return rgbToHex(a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t);
}

function getColorRamp(name, n) {
  var base = COLOR_RAMPS[name] || COLOR_RAMPS.blue;
  if (n <= 1) return [base[base.length - 1]];
  if (n === base.length) return base.slice();
  var colors = [];
  for (var i = 0; i < n; i++) {
    var t = i / (n - 1);
    var idx = t * (base.length - 1);
    var lo = Math.floor(idx), hi = Math.min(lo + 1, base.length - 1);
    colors.push(interpolateColor(base[lo], base[hi], idx - lo));
  }
  return colors;
}

// ================================================================
// Classification (choropleth breaks)
// ================================================================
function quantileBreaks(values, n) {
  var sorted = values.slice().sort(function(a,b){ return a - b; });
  var breaks = [];
  for (var i = 1; i < n; i++) {
    var idx = Math.floor(i * sorted.length / n);
    breaks.push(sorted[Math.min(idx, sorted.length - 1)]);
  }
  return breaks;
}

function equalIntervalBreaks(values, n) {
  var min = values.reduce(function(a,b){ return a < b ? a : b; });
  var max = values.reduce(function(a,b){ return a > b ? a : b; });
  var step = (max - min) / n;
  var breaks = [];
  for (var i = 1; i < n; i++) breaks.push(min + step * i);
  return breaks;
}

function naturalBreaks(values, n) {
  // Guard: fall back to quantile for large datasets to avoid O(n²·k) hang
  if (values.length > 10000) return quantileBreaks(values, n);

  var sorted = values.slice().sort(function(a,b){ return a - b; });
  var len = sorted.length;
  if (len <= n) return sorted.slice(0, len - 1);

  var mat1 = [], mat2 = [];
  for (var i = 0; i <= len; i++) {
    mat1.push(new Array(n + 1).fill(0));
    mat2.push(new Array(n + 1).fill(Infinity));
  }
  for (var cl = 1; cl <= n; cl++) { mat1[1][cl] = 1; mat2[1][cl] = 0; }

  for (var l = 2; l <= len; l++) {
    var s2 = 0, s1 = 0, w = 0;
    for (var m = 1; m <= l; m++) {
      var lower = l - m + 1;
      var val = sorted[lower - 1];
      s2 += val * val; s1 += val; w++;
      var v = s2 - (s1 * s1) / w;
      if (lower > 1) {
        for (var cl2 = 2; cl2 <= n; cl2++) {
          if (mat2[l][cl2] >= v + mat2[lower - 1][cl2 - 1]) {
            mat1[l][cl2] = lower;
            mat2[l][cl2] = v + mat2[lower - 1][cl2 - 1];
          }
        }
      }
    }
    mat1[l][1] = 1;
    mat2[l][1] = s2 - (s1 * s1) / w;
  }

  var breaks = [];
  var k = len;
  for (var j = n; j >= 2; j--) {
    breaks.unshift(sorted[mat1[k][j] - 1]);
    k = mat1[k][j] - 1;
  }
  return breaks;
}

function getBreaks(values, method, n) {
  var valid = values.filter(function(v){ return v != null && !isNaN(v); });
  if (valid.length === 0) return [];
  switch (method) {
    case 'equal-interval': return equalIntervalBreaks(valid, n);
    case 'natural-breaks': return naturalBreaks(valid, n);
    case 'quantile': default: return quantileBreaks(valid, n);
  }
}

// ================================================================
// Bounds tracking
// ================================================================
var allBounds = null; // [west, south, east, north]

function extendBounds(geojson) {
  if (!geojson || !geojson.features) return;
  geojson.features.forEach(function(f) {
    if (!f.geometry) return;
    extractCoords(f.geometry).forEach(function(c) {
      if (!allBounds) allBounds = [c[0], c[1], c[0], c[1]];
      else {
        if (c[0] < allBounds[0]) allBounds[0] = c[0];
        if (c[1] < allBounds[1]) allBounds[1] = c[1];
        if (c[0] > allBounds[2]) allBounds[2] = c[0];
        if (c[1] > allBounds[3]) allBounds[3] = c[1];
      }
    });
  });
}

function extractCoords(geom) {
  switch (geom.type) {
    case 'Point': return [geom.coordinates];
    case 'MultiPoint': case 'LineString': return geom.coordinates;
    case 'MultiLineString': case 'Polygon': return geom.coordinates.flat();
    case 'MultiPolygon': return geom.coordinates.flat(2);
    default: return [];
  }
}

// ================================================================
// Pre-process config (compute derived values)
// ================================================================
function preprocessConfig() {
  CONFIG.layers.forEach(function(cfg) {
    // Auto-compute max_value for sized-radius points from inline data
    if (cfg.radius && typeof cfg.radius === 'object' && cfg.radius.field && !cfg.radius.max_value && cfg.data) {
      var maxVal = 0;
      cfg.data.features.forEach(function(f) {
        var v = f.properties && f.properties[cfg.radius.field];
        if (v != null && !isNaN(v) && Number(v) > maxVal) maxVal = Number(v);
      });
      cfg.radius.max_value = maxVal || 1000;
    }
  });
}

function applyLayerMeta(def, cfg, sourceLayer) {
  if (sourceLayer) def['source-layer'] = sourceLayer;
  if (cfg.minZoom) def.minzoom = cfg.minZoom;
  if (cfg.maxZoom) def.maxzoom = cfg.maxZoom;
}

// Find the first symbol (label) layer in the basemap so data fills go below labels
function firstSymbolLayer(map) {
  var layers = map.getStyle().layers;
  for (var i = 0; i < layers.length; i++) {
    if (layers[i].type === 'symbol') return layers[i].id;
  }
  return undefined;
}

// ================================================================
// Layer loading
// ================================================================
function loadLayers(map) {
  var promises = CONFIG.layers.map(function(cfg) {
    return resolveLayerData(cfg).then(function(geojson) {
      if (geojson) extendBounds(geojson);
      addLayerToMap(map, cfg, geojson);
    });
  });
  return Promise.all(promises);
}

function resolveLayerData(cfg) {
  if (cfg.data) return Promise.resolve(cfg.data);
  if (cfg.source && typeof cfg.source === 'string') {
    if (cfg.source.endsWith('.pmtiles')) return Promise.resolve(null);
    return fetch(cfg.source).then(function(r) {
      if (!r.ok) throw new Error('Failed to load ' + cfg.source + ' (' + r.status + ')');
      return r.json();
    });
  }
  return Promise.resolve(null);
}

function addLayerToMap(map, cfg, geojson) {
  var sourceId = 'source-' + cfg.id;
  var mapLayerIds = [];

  // Fix #5: compute radius max_value from fetched external data
  if (geojson && cfg.radius && typeof cfg.radius === 'object' && cfg.radius.field && !cfg.radius.max_value) {
    var maxVal = 0;
    geojson.features.forEach(function(f) {
      var v = f.properties && f.properties[cfg.radius.field];
      if (v != null && !isNaN(v) && Number(v) > maxVal) maxVal = Number(v);
    });
    cfg.radius.max_value = maxVal || 1000;
  }

  // Add source
  if (cfg.source && typeof cfg.source === 'string' && cfg.source.endsWith('.pmtiles')) {
    map.addSource(sourceId, { type: 'vector', url: 'pmtiles://' + cfg.source });
  } else if (geojson) {
    map.addSource(sourceId, { type: 'geojson', data: geojson });
  } else {
    return;
  }

  var sourceLayer = cfg.sourceLayer || undefined;

  // Render layer by type
  switch (cfg.type) {
    case 'points':     mapLayerIds = addPointLayer(map, cfg, sourceId, sourceLayer); break;
    case 'polygons':   mapLayerIds = addPolygonLayer(map, cfg, sourceId, sourceLayer); break;
    case 'lines':      mapLayerIds = addLineLayer(map, cfg, sourceId, sourceLayer); break;
    case 'choropleth': mapLayerIds = addChoroplethLayer(map, cfg, sourceId, geojson, sourceLayer); break;
    default:           mapLayerIds = addPointLayer(map, cfg, sourceId, sourceLayer);
  }

  // Initial visibility
  var vis = cfg.visible !== false ? 'visible' : 'none';
  mapLayerIds.forEach(function(lid) {
    map.setLayoutProperty(lid, 'visibility', vis);
  });

  layerState[cfg.id] = { mapLayerIds: mapLayerIds, data: geojson, config: cfg };

  // Click-to-inspect — bind to fill layer (index 0) for polygons/choropleths, not outline
  var clickId = mapLayerIds[0];
  map.on('click', clickId, function(e) {
    if (!e.features || !e.features.length) return;
    showPopup(map, e.lngLat, e.features[0].properties || {}, cfg);
  });
  map.on('mouseenter', clickId, function() { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', clickId, function() { map.getCanvas().style.cursor = ''; });
}

// ================================================================
// Point layer
// ================================================================
function addPointLayer(map, cfg, sourceId, sourceLayer) {
  var layerId = cfg.id + '-circles';
  var paint = {};

  // Color: single string, or categorical { field, map, default }
  if (cfg.color && typeof cfg.color === 'object' && cfg.color.field) {
    var expr = ['match', ['get', cfg.color.field]];
    var cm = cfg.color.map || {};
    Object.keys(cm).forEach(function(k) { expr.push(k, cm[k]); });
    expr.push(cfg.color.default || '#5C5C5C');
    paint['circle-color'] = expr;
  } else {
    paint['circle-color'] = cfg.color || '#2B4B6F';
  }

  // Radius: fixed number, or scaled { field, min, max, max_value }
  if (cfg.radius && typeof cfg.radius === 'object' && cfg.radius.field) {
    var sqrtMax = Math.sqrt(cfg.radius.max_value || 1000);
    paint['circle-radius'] = [
      'interpolate', ['linear'],
      ['sqrt', ['max', ['to-number', ['get', cfg.radius.field], 0], 0]],
      0, cfg.radius.min || 3,
      sqrtMax, cfg.radius.max || 20
    ];
  } else {
    paint['circle-radius'] = cfg.radius || 6;
  }

  paint['circle-stroke-color'] = cfg.strokeColor || '#1A1A1A';
  paint['circle-stroke-width'] = cfg.strokeWidth != null ? cfg.strokeWidth : 0.75;
  paint['circle-opacity'] = cfg.opacity != null ? cfg.opacity : 0.85;

  var def = { id: layerId, type: 'circle', source: sourceId, paint: paint };
  applyLayerMeta(def, cfg, sourceLayer);

  map.addLayer(def);
  return [layerId];
}

// ================================================================
// Polygon layer
// ================================================================
function addPolygonLayer(map, cfg, sourceId, sourceLayer) {
  var fillId = cfg.id + '-fill';
  var lineId = cfg.id + '-outline';
  var beforeId = firstSymbolLayer(map);

  var fillDef = {
    id: fillId, type: 'fill', source: sourceId,
    paint: {
      'fill-color': cfg.fillColor || '#2B4B6F',
      'fill-opacity': cfg.fillOpacity != null ? cfg.fillOpacity : 0.3
    }
  };
  var lineDef = {
    id: lineId, type: 'line', source: sourceId,
    paint: {
      'line-color': cfg.strokeColor || cfg.fillColor || '#2B4B6F',
      'line-width': cfg.strokeWidth != null ? cfg.strokeWidth : 1,
      'line-opacity': cfg.strokeOpacity != null ? cfg.strokeOpacity : 0.8
    }
  };

  [fillDef, lineDef].forEach(function(d) { applyLayerMeta(d, cfg, sourceLayer); });

  map.addLayer(fillDef, beforeId);
  map.addLayer(lineDef, beforeId);
  return [fillId, lineId];
}

// ================================================================
// Line layer
// ================================================================
function addLineLayer(map, cfg, sourceId, sourceLayer) {
  var layerId = cfg.id + '-line';
  var beforeId = firstSymbolLayer(map);
  var def = {
    id: layerId, type: 'line', source: sourceId,
    paint: {
      'line-color': cfg.strokeColor || '#8B2B2B',
      'line-width': cfg.strokeWidth != null ? cfg.strokeWidth : 2,
      'line-opacity': cfg.opacity != null ? cfg.opacity : 0.8
    },
    layout: { 'line-cap': 'round', 'line-join': 'round' }
  };
  applyLayerMeta(def, cfg, sourceLayer);

  map.addLayer(def, beforeId);
  return [layerId];
}

// ================================================================
// Choropleth layer
// ================================================================
function addChoroplethLayer(map, cfg, sourceId, geojson, sourceLayer) {
  var fillId = cfg.id + '-fill';
  var lineId = cfg.id + '-outline';
  var beforeId = firstSymbolLayer(map);
  var valueField = cfg.valueField || 'value';
  var classes = cfg.classes || 5;
  var rampName = cfg.colorRamp || 'blue';
  var paint = {};

  // Extract numeric values from features
  var values = [];
  if (geojson && geojson.features) {
    geojson.features.forEach(function(f) {
      var v = f.properties && f.properties[valueField];
      if (v != null && !isNaN(v)) values.push(Number(v));
    });
  }

  if (values.length > 0) {
    var breaks = getBreaks(values, cfg.method || 'quantile', classes);
    var colors = getColorRamp(rampName, classes);

    // Deduplicate adjacent identical breaks
    var uBreaks = [], uColors = [colors[0]];
    for (var i = 0; i < breaks.length; i++) {
      if (uBreaks.length === 0 || breaks[i] > uBreaks[uBreaks.length - 1]) {
        uBreaks.push(breaks[i]);
        uColors.push(colors[i + 1]);
      }
    }

    // MapLibre step expression
    var step = ['step', ['to-number', ['get', valueField], 0], uColors[0]];
    for (var j = 0; j < uBreaks.length; j++) {
      step.push(uBreaks[j], uColors[j + 1]);
    }
    paint['fill-color'] = step;

    // Store for legend rendering
    cfg._breaks = uBreaks;
    cfg._colors = uColors;
    cfg._min = values.reduce(function(a,b){ return a < b ? a : b; });
    cfg._max = values.reduce(function(a,b){ return a > b ? a : b; });
  } else {
    paint['fill-color'] = cfg.fillColor || '#cccccc';
  }

  paint['fill-opacity'] = cfg.fillOpacity != null ? cfg.fillOpacity : 0.7;

  var fillDef = { id: fillId, type: 'fill', source: sourceId, paint: paint };
  var lineDef = {
    id: lineId, type: 'line', source: sourceId,
    paint: { 'line-color': '#1A1A1A', 'line-width': 0.5, 'line-opacity': 0.6 }
  };

  [fillDef, lineDef].forEach(function(d) { applyLayerMeta(d, cfg, sourceLayer); });

  map.addLayer(fillDef, beforeId);
  map.addLayer(lineDef, beforeId);
  return [fillId, lineId];
}

// ================================================================
// Popup (click-to-inspect)
// ================================================================
function showPopup(map, lngLat, props, cfg) {
  // Determine header text
  var header = props.name || props.label || props.NAME || props.LABEL || cfg.label || cfg.id;

  var html = '<div class="popup-header">' + escapeHtml(header) + '</div><div class="popup-body">';
  var skip = { _color:1, _radius:1 };

  // If the header came from a property, skip it in the body
  var headerKey = ['name','label','NAME','LABEL'].find(function(k){ return props[k] === header; });
  if (headerKey) skip[headerKey] = 1;

  Object.keys(props).forEach(function(key) {
    if (skip[key]) return;
    // MapLibre stringifies nested objects from vector tiles — skip internal fields
    if (key.charAt(0) === '_') return;
    html += '<div class="popup-row">' +
      '<span class="popup-field">' + escapeHtml(key) + '</span>' +
      '<span class="popup-value">' + escapeHtml(String(props[key])) + '</span>' +
    '</div>';
  });
  html += '</div>';

  new maplibregl.Popup({ maxWidth: '300px' })
    .setLngLat(lngLat)
    .setHTML(html)
    .addTo(map);
}

// ================================================================
// Sidebar construction
// ================================================================
function buildSidebar(map) {
  var togglesEl = document.getElementById('layer-toggles');
  var filtersEl = document.getElementById('filter-controls');
  var legendEl  = document.getElementById('legend-content');
  var hasFilters = false;

  CONFIG.layers.forEach(function(cfg) {
    // ── Toggle ──
    var lbl = document.createElement('label');
    lbl.className = 'layer-toggle';
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = cfg.visible !== false;
    cb.addEventListener('change', function() {
      var vis = cb.checked ? 'visible' : 'none';
      var st = layerState[cfg.id];
      if (st) st.mapLayerIds.forEach(function(lid) { map.setLayoutProperty(lid, 'visibility', vis); });
    });
    lbl.appendChild(cb);
    var span = document.createElement('span');
    span.textContent = cfg.label || cfg.id;
    lbl.appendChild(span);
    togglesEl.appendChild(lbl);

    // ── Filter ──
    if (cfg.filter && layerState[cfg.id] && layerState[cfg.id].data) {
      hasFilters = true;
      var group = document.createElement('div');
      group.className = 'filter-group';

      var fLabel = document.createElement('div');
      fLabel.className = 'filter-label';
      fLabel.textContent = cfg.filter.label || cfg.filter.field;
      group.appendChild(fLabel);

      var sel = document.createElement('select');
      sel.className = 'filter-select';
      var allOpt = document.createElement('option');
      allOpt.value = '__all__';
      allOpt.textContent = 'All';
      sel.appendChild(allOpt);

      var vals = new Set();
      layerState[cfg.id].data.features.forEach(function(f) {
        var v = f.properties && f.properties[cfg.filter.field];
        if (v != null) vals.add(String(v));
      });
      Array.from(vals).sort().forEach(function(v) {
        var opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        sel.appendChild(opt);
      });

      sel.addEventListener('change', function() {
        var st = layerState[cfg.id];
        if (!st) return;
        st.mapLayerIds.forEach(function(lid) {
          map.setFilter(lid, sel.value === '__all__' ? null : ['==', ['get', cfg.filter.field], sel.value]);
        });
      });
      group.appendChild(sel);
      filtersEl.appendChild(group);
    }

    // ── Legend ──
    buildLegendEntry(legendEl, cfg);
  });

  if (hasFilters) document.getElementById('filters-section').style.display = '';
}

// ================================================================
// Legend rendering
// ================================================================
function buildLegendEntry(container, cfg) {
  var group = document.createElement('div');
  group.className = 'legend-group';

  if (cfg.legendTitle) {
    var title = document.createElement('div');
    title.className = 'legend-title';
    title.textContent = cfg.legendTitle;
    group.appendChild(title);
  }

  switch (cfg.type) {
    case 'points':
      if (cfg.color && typeof cfg.color === 'object' && cfg.color.map) {
        Object.keys(cfg.color.map).forEach(function(k) {
          group.appendChild(makeLegendItem(cfg.color.map[k], k, 'circle'));
        });
      } else {
        group.appendChild(makeLegendItem(
          typeof cfg.color === 'string' ? cfg.color : '#2B4B6F',
          cfg.label || cfg.id, 'circle'
        ));
      }
      break;

    case 'choropleth':
      if (cfg._colors && cfg._colors.length > 0) {
        var ramp = document.createElement('div');
        ramp.className = 'legend-ramp';
        cfg._colors.forEach(function(c) {
          var cell = document.createElement('div');
          cell.className = 'legend-ramp-cell';
          cell.style.backgroundColor = c;
          ramp.appendChild(cell);
        });
        group.appendChild(ramp);

        if (cfg._min != null) {
          var labels = document.createElement('div');
          labels.className = 'legend-ramp-labels';
          var minSpan = document.createElement('span');
          minSpan.textContent = formatValue(cfg._min, cfg.valueFormat);
          labels.appendChild(minSpan);
          var maxSpan = document.createElement('span');
          maxSpan.textContent = formatValue(cfg._max, cfg.valueFormat);
          labels.appendChild(maxSpan);
          group.appendChild(labels);
        }
      }
      break;

    case 'polygons':
      group.appendChild(makeLegendItem(cfg.fillColor || '#2B4B6F', cfg.label || cfg.id, 'polygon'));
      break;

    case 'lines':
      group.appendChild(makeLegendItem(cfg.strokeColor || '#8B2B2B', cfg.label || cfg.id, 'line'));
      break;
  }

  container.appendChild(group);
}

function makeLegendItem(color, text, shape) {
  var item = document.createElement('div');
  item.className = 'legend-item';
  var swatch = document.createElement('div');
  swatch.className = 'legend-swatch' + (shape === 'circle' ? ' circle' : shape === 'line' ? ' line-swatch' : '');
  swatch.style.backgroundColor = color;
  item.appendChild(swatch);
  var label = document.createElement('span');
  label.textContent = text;
  item.appendChild(label);
  return item;
}

// ================================================================
// Error display
// ================================================================
function showError(msg) {
  var el = document.createElement('div');
  el.className = 'error-message';
  el.textContent = 'Error: ' + msg;
  document.querySelector('.map-wrap').appendChild(el);
}

// ================================================================
// Boot — wait for deferred MapLibre script to load
// ================================================================
document.addEventListener('DOMContentLoaded', function() {
  try {
    var needsPMTiles = CONFIG.layers && CONFIG.layers.some(function(l) {
      return l.source && typeof l.source === 'string' && l.source.endsWith('.pmtiles');
    });

    if (needsPMTiles) {
      var s = document.createElement('script');
      s.src = 'https://unpkg.com/pmtiles@3.0.6/dist/pmtiles.js';
      s.onload = function() {
        var protocol = new pmtiles.Protocol();
        maplibregl.addProtocol('pmtiles', protocol.tile);
        initMap();
      };
      s.onerror = function() { showError('Failed to load PMTiles library.'); };
      document.head.appendChild(s);
    } else {
      initMap();
    }
  } catch (err) {
    showError(err.message || String(err));
  }
});
</script>
