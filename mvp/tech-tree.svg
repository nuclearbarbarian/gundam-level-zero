<?xml version="1.0" encoding="UTF-8"?>
<!--
  HEAVYARMS TECH TREE v0.1 — Hackathon MVP
  Register: ARPANET (per MechaPDS v0.2 §Logical maps)
  Genre: BBN ARPANET logical map (Heart, McKenzie, McQuillan & Walden, 1978/1981)

  v0.1 adds: GUNDAM LEVEL ZERO threshold band + precursor baseline row.

  [HONESTY-CHECK] (per MechaPDS Rule 2)
    1. Depicted dimension: distance to GUNDAM LEVEL ZERO threshold, expressed as three
       vertical bands — PRECURSOR (extant today), GATING (Phase 2 research), THRESHOLD
       (above which Heavyarms-class production becomes possible per CLAUDE.md).
    2. Depicted entities: 21 gating nodes (T1-T7) + 7 precursor entries.
    3. Pairwise equivalence: nodes equivalent within their band; band membership encodes
       hierarchy via vertical placement and glyph (boxes vs triangles), not flat form.
    4. Other ranking dimensions (criticality, cost, technical risk) NOT load-bearing for
       this figure's argument; track placement is alphabetical by track ID.
    5. PRECURSOR ROW ENTRIES are indicative-not-sourced; flagged with [△] glyph and explicit
       caveat. T1-T5 Phase 2 hunt will validate or revise. Honesty Rule 4 satisfied.

  Color-pair compliance (Rule 4): readiness state encoded by bracket+glyph (semantic) AND
  fill (visual). Glyph alone is sufficient; figure remains legible in grayscale and to
  color-blind readers. No information depends on color.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 700"
     font-family="'IBM Plex Mono', Consolas, monospace"
     fill="#1A1A1A">

  <style>
    text { stroke: none; }
    .label { font-size: 11px; letter-spacing: 0.04em; }
    .node-label { font-size: 10.5px; }
    .track-header { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; }
    .track-sub { font-size: 9px; letter-spacing: 0.06em; }
    .band-label { font-size: 11px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; }
    .band-label-large { font-size: 14px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; }
    .node-box { fill: #FDFCF9; stroke: #1A1A1A; stroke-width: 1; }
    .node-box-researched { fill: #1A1A1A; stroke: #1A1A1A; stroke-width: 1; }
    .node-box-scoped { fill: #FDFCF9; stroke: #1A1A1A; stroke-width: 1; stroke-dasharray: 3 2; }
    .node-box-precursor { fill: #FDFCF9; stroke: #1A1A1A; stroke-width: 0.75; }
    .node-text-light { fill: #FDFCF9; }
    .glyph { font-size: 13px; }
    .edge { fill: none; stroke: #1A1A1A; stroke-width: 0.75; }
    .edge-cross { fill: none; stroke: #1A1A1A; stroke-width: 0.75; stroke-dasharray: 4 3; }
    .axis { stroke: #1A1A1A; stroke-width: 0.5; }
    .frame { fill: none; stroke: #1A1A1A; stroke-width: 1; }
    .threshold-line { stroke: #1A1A1A; stroke-width: 2; }
    .threshold-line-thin { stroke: #1A1A1A; stroke-width: 0.75; }
    .baseline-line { stroke: #1A1A1A; stroke-width: 0.5; stroke-dasharray: 2 2; }
  </style>

